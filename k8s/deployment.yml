apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
    tier: frontend
    version: "v3"                 # cambio para probar la sincronización automática
spec:
  replicas: 2                     # réplicas iniciales (luego el HPA ajusta entre 2 y 5)
  selector:
    matchLabels:
      app: web-app                # debe coincidir con las labels del template
  template:
    metadata:
      labels:
        app: web-app
        tier: frontend
    spec:
      containers:
        - name: web-app
          # Imagen oficial de ejemplo para HPA (Apache + PHP que consume CPU en cada petición)
          image: registry.k8s.io/hpa-example:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80   # puerto expuesto por la aplicación
          resources:
            requests:             # base sobre la que el HPA calcula el % de CPU
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
