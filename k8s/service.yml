apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels:
    app: web-app
spec:
  type: NodePort
  selector:
    app: web-app            # asocia el Service con los Pods del Deployment
  ports:
    - name: http
      protocol: TCP
      port: 80              # puerto del Service dentro del clúster
      targetPort: 80        # puerto del contenedor (containerPort)
      nodePort: 30080       # acceso externo: http://<IP-del-nodo>:30080
